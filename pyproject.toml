[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soundsave"
version = "2.4.0"
description = "Downloader and organizer for Yandex Music and Zvuk: keeps a local playlist archive and upgrades it to 320 kbps MP3 or FLAC."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "northis" }]
keywords = [
    "yandex-music",
    "zvuk",
    "music",
    "downloader",
    "organizer",
    "archive",
    "mp3",
    "flac",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "mutagen>=1.47",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "yandex-music>=3.2.2,<4",
    "zvuk-music>=0.6.3,<1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "Pillow>=11",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
    "httpx>=0.27",
    "fonttools>=4.50",
]

[project.scripts]
soundsave = "soundsave.cli:main"

[project.urls]
Repository = "https://github.com/northis/soundsave"
Issues = "https://github.com/northis/soundsave/issues"
Changelog = "https://github.com/northis/soundsave/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/soundsave"]

[tool.hatch.build.targets.sdist]
include = [
    "src/soundsave",
    "src/soundsave/web/static/**",
    "tests",
    "tools/make_icons.py",
    "tools/assets/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    ".env.template",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", # gradual typing in tests and small helpers
    "BLE001", # the CLI reports errors from third-party code
    "CPY001", # no copyright header in each file
    "C901", # orchestration functions are intentionally linear
    "COM812", "ISC001", # conflicts with the formatter
    "D", # the app is documented in README/docs
    "EM101", "EM102", "TRY003", # short inline error messages
    "FBT001", "FBT002", # boolean CLI flags are positional in argparse
    "PERF203", # retry loops are deliberate
    "PLR0912", "PLR0913", "PLR0915", "PLR0917", # orchestration signatures
    "PLR0911", # the CLI has one return per command/error path
    "PLR2004", # named constants are not always worth it
    "PYI034", # __enter__ returns the concrete class for 3.10 compatibility
    "RUF001", "RUF002", "RUF003", # Russian text in docs and messages
    "S101", # asserts in tests
    "S603", "S607", # ffmpeg is resolved from PATH
    "T201", # the CLI prints reports
    "TC001", "TC002", "TC003", # annotations are not a runtime concern here
    "TID252", # the package uses relative imports internally
    "TRY400", # expected configuration/provider errors do not need a traceback
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"src/soundsave/cli.py" = [
    "PLC0415", # web/uvicorn imports are optional extras and stay lazy
]
"tests/*" = [
    "ARG001",
    "ARG002",
    "ARG005",
    "PT011",
    "RUF012",
    "S105",
    "S106",
    "SLF001",
]
