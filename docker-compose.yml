# Soundsave web player + SQLite index. All user data stays on the host:
# ./music (playlist folders) and ./data (database, cover cache).
services:
  soundsave:
    build:
      context: .
      args:
        SOUNDSAVE_COMMIT: "${SOUNDSAVE_COMMIT:-}"
        SOUNDSAVE_COMMIT_DATE: "${SOUNDSAVE_COMMIT_DATE:-}"
        SOUNDSAVE_VERSION: "${SOUNDSAVE_VERSION:-}"
        SOUNDSAVE_CREATED: "${SOUNDSAVE_CREATED:-}"
    image: soundsave:latest
    container_name: soundsave
    restart: unless-stopped
    ports:
      - "${SOUNDSAVE_BIND_ADDR:-0.0.0.0}:${SOUNDSAVE_PORT:-8765}:8765"
    environment:
      MUSIC_DIR: /music
      MAIN_PLAYLIST: "${MAIN_PLAYLIST:-Main}"
      DATA_DIR: /app/data
      PLAYLIST_URL: "${PLAYLIST_URL:-}"
      YANDEX_TOKEN: "${YANDEX_TOKEN:-}"
      MAX_DOWNLOADS: "${MAX_DOWNLOADS:-20}"
      SOUNDSAVE_DELAY: "${SOUNDSAVE_DELAY:-1.0}"
    volumes:
      # Host paths. MUSIC_HOST_DIR/DATA_HOST_DIR are only used by compose;
      # the paths inside the container are fixed to /music and /app/data.
      # Playlist folders: the main playlist is writable for Yandex sync; the
      # other folders are read-only at the application level.
      - "${MUSIC_HOST_DIR:-./music}:/music"
      # library.sqlite3 and the extracted cover thumbnails.
      - "${DATA_HOST_DIR:-./data}:/app/data"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
