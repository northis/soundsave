# Soundsave web player + SQLite index. All user data stays on the host:
# MUSIC_DIR (playlist folders) and DATA_DIR (database, cover cache). Both are
# the same variables a local run uses; the container paths are fixed.
services:
  soundsave:
    build:
      context: .
      args:
        SOUNDSAVE_COMMIT: "${SOUNDSAVE_COMMIT:-}"
        SOUNDSAVE_COMMIT_DATE: "${SOUNDSAVE_COMMIT_DATE:-}"
        SOUNDSAVE_VERSION: "${SOUNDSAVE_VERSION:-}"
        SOUNDSAVE_CREATED: "${SOUNDSAVE_CREATED:-}"
    image: soundsave:latest
    container_name: soundsave
    restart: unless-stopped
    ports:
      - "${SOUNDSAVE_BIND_ADDR:-0.0.0.0}:${SOUNDSAVE_PORT:-8765}:8765"
    environment:
      # Fixed paths inside the container. The MUSIC_DIR/DATA_DIR values in
      # .env are host paths and are only used by the volumes below.
      MUSIC_DIR: /music
      MAIN_PLAYLIST: "${MAIN_PLAYLIST-Main}"
      DATA_DIR: /app/data
      PLAYLIST_URL: "${PLAYLIST_URL:-}"
      YANDEX_TOKEN: "${YANDEX_TOKEN:-}"
      # The CLI accepts API_KEY as an alias; pass it through for older .env files.
      API_KEY: "${API_KEY:-}"
      MAX_DOWNLOADS: "${MAX_DOWNLOADS:-20}"
      SOUNDSAVE_DELAY: "${SOUNDSAVE_DELAY:-1.0}"
    volumes:
      # Host paths from .env. Playlist folders: the main playlist is writable
      # for Yandex sync; the other folders are read-only at the application
      # level.
      - "${MUSIC_DIR:?set MUSIC_DIR in .env to the host music folder}:/music"
      # library.sqlite3 and the extracted cover thumbnails.
      - "${DATA_DIR:-./data}:/app/data"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
